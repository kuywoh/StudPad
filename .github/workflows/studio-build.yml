name: studio-build

# Builds StudPad Studio: the official arm64 macOS Studio, retargeted for iOS, loaded through
# libMacShim.dylib. The IPA contains Studio and is therefore only ever a private artifact of this
# job; nothing binary is committed. Text reports are uploaded even when the build fails.
#
# Each stage is its own step: a stall then shows up as one running step with everything before it
# green, and the timings say where the minutes go.

on:
  workflow_dispatch:
  push:
    paths:
      - "shim/**"
      - "app/**"
      - "tools/**"
      - "studio/**"
      - "recon/fetch_studio.sh"
      - ".github/workflows/studio-build.yml"

permissions:
  contents: read

concurrency:
  group: studio-build
  # A newer push replaces an older build; a stuck run must never block the next attempt.
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select an iOS 26 SDK Xcode
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find dyld_info || xcrun --find dyldinfo || echo "no dyld_info"

      - name: Fetch the official Studio package
        run: |
          set -o pipefail
          chmod +x studio/build.sh recon/fetch_studio.sh
          studio/build.sh fetch 2>&1 | tee -a .work-build.log

      - name: Stage the guest, Qt and the plugins
        run: studio/build.sh stage 2>&1 | tee -a .work-build.log

      - name: Retarget pass 1
        run: studio/build.sh retarget1 2>&1 | tee -a .work-build.log

      - name: Compile the shim and plan the stubs
        run: studio/build.sh plan 2>&1 | tee -a .work-build.log

      - name: Retarget pass 2 (shim binds)
        run: studio/build.sh retarget2 2>&1 | tee -a .work-build.log

      - name: Link libMacShim.dylib
        run: studio/build.sh link 2>&1 | tee -a .work-build.log

      - name: Build the host app
        run: studio/build.sh host 2>&1 | tee -a .work-build.log

      - name: Check the bindings
        run: studio/build.sh check 2>&1 | tee -a .work-build.log

      - name: Sign
        run: studio/build.sh sign 2>&1 | tee -a .work-build.log

      - name: Package and verify
        run: studio/build.sh package 2>&1 | tee -a .work-build.log

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-build-report-${{ github.run_number }}
          path: |
            .work-build.log
            .work/studio/shim-plan.txt
            .work/studio/retarget.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudPadStudio-ipa
          path: |
            .work/studio/StudPadStudio.ipa
            .work/studio/StudPadStudio.ipa.sha256
          if-no-files-found: error
          retention-days: 3
