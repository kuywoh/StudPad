name: studio-probe

# Builds the Studio load probe from the official arm64 package. The IPA contains Studio and is
# uploaded only as a private artifact; it is never committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch Studio and build probe
        run: |
          set -euo pipefail
          chmod +x studio/build.sh
          studio/build.sh

      - name: Upload probe IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudPadStudioProbe
          path: .work/studio-probe/StudPadStudioProbe.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload host-only control IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudPadHostOnly
          path: .work/studio-probe/StudPadHostOnly.ipa
          if-no-files-found: error
          retention-days: 1
